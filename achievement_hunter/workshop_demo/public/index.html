<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Achievement Hunter — Workshop Demo</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header id="page-header">
  <h1>Achievement Hunter — pick an achievement</h1>
</header>
<main>
  <section id="selection-view">
    <div id="ptd-grid"></div>
  </section>

  <section id="status-view" class="hidden">
    <div class="run-header">
      <div class="objective" id="status-objective"></div>
      <div class="status-label" id="status-label"></div>
      <div class="status-detail" id="status-detail"></div>
      <div class="status-detail" id="spectator-detail"></div>
    </div>

    <div id="live-stale-warning" class="hidden">
      Live view hasn't updated in a while — the agent may be stuck. It
      often recovers on its own; if not, use "Back to selection" to
      restart the run.
    </div>

    <div id="live-dashboard" class="hidden">
      <div class="live-panel graph-panel" id="graph-panel">
        <div class="panel-title">Dependency graph</div>
        <div class="legend">
          <span class="legend-item"><span class="legend-swatch legend-swatch--goal"></span>Goal</span>
          <span class="legend-item"><span class="legend-swatch legend-swatch--remaining"></span>Remaining</span>
          <span class="legend-item"><span class="legend-swatch legend-swatch--current"></span>Current</span>
          <span class="legend-item"><span class="legend-swatch legend-swatch--done"></span>Done</span>
          <span class="legend-item"><span class="legend-swatch legend-swatch--candidate"></span>Candidate (white ring, any color)</span>
        </div>
        <div class="mermaid" id="live-graph"></div>
      </div>

      <div class="live-panel recovery-panel hidden" id="recovery-panel">
        <div class="recovery-header">
          <div class="recovery-title" id="recovery-title"></div>
          <div class="recovery-attempt" id="recovery-attempt"></div>
        </div>
        <div class="recovery-context" id="recovery-context"></div>
        <div class="recovery-note" id="recovery-note"></div>
        <div class="recovery-actions" id="recovery-actions"></div>
      </div>
    </div>

    <button id="back-button">Back to selection</button>
  </section>
</main>

<script src="/vendor/mermaid/mermaid.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
